<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Toán Học - Chuyển đổi số</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Thư viện MathJax hiển thị công thức Toán -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
   <!-- GIAO DIỆN 1: Bắt đầu -->
    <div id="ui-1" class="screen">
        
        <!-- Nút Bảng xếp hạng vuông ở góc phải trên -->
        <button id="btnViewLeaderboard" class="btn-leaderboard-top" title="Xem bảng xếp hạng">🏆</button>
        
        <!-- Cụm tiêu đề chính giữa -->
        <div class="header-titles">
            <!-- Logo đã được dời vào đây -->
            <img src="logo-hcmue.png" alt="Logo HCMUE" class="logo-img">
            
            <h3 class="uni-name">Trường Đại học Sư phạm Thành phố Hồ Chí Minh</h3>
            <h1 class="faculty-name">KHOA TOÁN - TIN HỌC</h1>
            <h2 class="event-name">Tuần lễ Chuyển đổi số</h2>
        </div>

        <!-- Hộp đăng nhập -->
        <div class="login-box">
            <input type="text" id="playerName" placeholder="Nhập tên người chơi...">
            <button id="btnPlay">PLAY</button>
        </div>
        
    </div>
        
    </div>

    <!-- GIAO DIỆN 2: Game Chính -->
    <div id="ui-2" class="screen" style="display: none;">
        <div class="game-header">
            <div class="question-box" id="questionBox">Câu hỏi: ...</div>
            <div class="score-box">Điểm: <span id="score">0</span></div>
        </div>
        
        <div id="game-area">
            <div class="gun" id="gun"></div>
        </div>

        <div class="game-footer">
            <div class="health-box">Máu: <span id="health">❤️❤️❤️</span></div>
            <div class="timer-box" style="display:none;">Thời gian: <span id="timer">30</span>s</div>
        </div>
    </div>

    <!-- GIAO DIỆN 3: Kết thúc -->
    <div id="ui-3" class="screen" style="display: none;">
        <div class="end-container">
            <!-- Khu vực Bảng xếp hạng -->
            <div class="leaderboard-section">
                <h3>🏆 BẢNG XẾP HẠNG 🏆</h3>
                <div class="table-container">
                    <table id="leaderboard-table">
                        <thead>
                            <tr>
                                <th>Hạng</th>
                                <th>Tên người chơi</th>
                                <th>Điểm</th>
                                <th>Quản lý</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                            <!-- Dữ liệu JS sẽ tự động đẩy vào đây -->
                        </tbody>
                    </table>
                </div>
            </div>
            
            <!-- Khu vực Điểm số & Nút bấm -->
            <div class="result-box">
                <h3>ĐIỂM CỦA BẠN</h3>
                <h1 id="final-score">0</h1>
                <button id="btnPlayAgain">CHƠI LẠI</button>
                <button id="btnNewGame">NGƯỜI MỚI</button>
                <button id="btnClearAll" class="btn-danger">XÓA TẤT CẢ DỮ LIỆU</button>
            </div>
        </div>
    </div>

    <!-- Thư viện Firebase đồng bộ dữ liệu thời gian thực -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
